name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pergo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Start NATS with JetStream
        run: |
          docker run --detach --name pergo-ci-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8222/jsz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pergo-ci-nats
          exit 1

      - name: Run Tests
        env:
          PERGO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pergo?sslmode=disable
          PERGO_NATS_URL: nats://localhost:4222
        run: go test ./... -race -count=1 -p 1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
