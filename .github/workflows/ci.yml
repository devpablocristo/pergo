name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pergo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Start NATS with JetStream
        run: |
          docker run --detach --name pergo-ci-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:8222/jsz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pergo-ci-nats
          exit 1

      - name: Run Tests
        env:
          PERGO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pergo?sslmode=disable
          PERGO_NATS_URL: nats://localhost:4222
        run: go test ./... -race -count=1 -p 1 -coverprofile=coverage.out

      - name: Enforce production runtime policy
        run: go test ./internal/config -run 'TestValidateProductionPolicy|TestValidateRejectsUnsafeDeploymentKEKs|TestValidateRejectsMalformedKEKInDevelopment' -count=1

      - name: Build runtime profiles
        run: go build ./cmd/pergo

      - name: Validate production container policy
        run: |
          grep -Fx '.env' .dockerignore
          grep -Fx '.git' .dockerignore
          if make prod; then
            echo "make prod must fail closed"
            exit 1
          fi
          docker build --tag pergo-ci .

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
